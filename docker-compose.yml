services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rieltor-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/rieltor.db
    volumes:
      - db_data:/app/data
      - uploads_data:/app/wwwroot/uploads
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rieltor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
